alerts:
  - name: HighLatencyP95
    severity: critical
    condition: "latency_p95_ms > 3000"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2.0"
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: "retrieval_success_rate_pct < 90.0"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-rag
    runbook: docs/alerts.md#alert-3
